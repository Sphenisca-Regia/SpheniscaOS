# Contributor licence agreement bot . OFF until the owner switches it on.
#
# The switch is the repository variable `CLA_ENABLED` (Settings > Secrets and variables > Actions >
# Variables). The job runs only when it is exactly `true`; unset or any other value skips the job, so the
# bot records no signature and posts no comment. The owner sets it once Sphenisca Regia LLC's registration
# is confirmed and counsel has reviewed CLA.md.
# Before setting it:
#   1. create the signatures branch `cla-signatures` and a token secret `CLA_BOT_TOKEN` with contents:write on it;
#   2. review the pinned action version.
# To switch it off again, set `CLA_ENABLED` to anything but `true` or delete it.
name: cla

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, closed]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # The explicit switch: never runs while the repository variable is unset.
    if: ${{ vars.CLA_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: CLA assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_BOT_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot]
          custom-pr-sign-comment: I have read the SpheniscaOS CLA and I hereby sign it.
