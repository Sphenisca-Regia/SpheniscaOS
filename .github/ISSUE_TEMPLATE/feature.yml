name: Feature
description: Something xx-os should do.
labels: [enhancement, triage]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - xx-wm (shell)
        - xxwm (river window manager)
        - xx-keyboard
        - xx-dialer
        - txxt
        - xx-contacts
        - xx-calendar
        - xx-email
        - xx-share
        - xx-captions
        - xx-clock
        - xx-note
        - xx-weather
        - xx-calculator
        - xx-files
        - xx-auth
        - xx-radio
        - xx-audiobook
        - xx-vitals
        - xx-auto
        - xx-find
        - common
        - Install / packaging
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do and why the phone gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd want instead
  - type: checkboxes
    id: build
    attributes:
      label: Building it
      options:
        - label: I'd like to build this myself
